<style>
        /* Custom styles for glows and animations */
        .nextera-glow {
            box-shadow: 0 0 40px rgba(224, 20, 47, 0.4);
        }
        .text-glow-primary {
            text-shadow: 0 0 20px rgba(255, 179, 175, 0.6);
        }
        .bg-radial-glow {
            background: radial-gradient(circle at center, rgba(224, 20, 47, 0.15) 0%, rgba(10, 10, 12, 0) 70%);
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.5; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.5; transform: scale(0.95); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 3s infinite ease-in-out;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 16px;
            background-color: var(--color-primary);
            animation: confetti-fall linear forwards;
            top: -20px;
        }
    </style>

<script>
        // Simple confetti script for atmospheric effect
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-container');
            const colors = ['#E0142F', '#E8B339', '#ffb3af']; // Crimson, Gold, Primary

            function createConfetti() {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                
                // Randomize properties
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // Randomize size slightly
                const scale = Math.random() * 0.5 + 0.5;
                confetti.style.transform = `scale(${scale})`;
                
                // Randomize animation duration and delay
                confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                confetti.style.animationDelay = Math.random() * 5 + 's';

                container.appendChild(confetti);

                // Remove after animation completes to keep DOM clean
                setTimeout(() => {
                    confetti.remove();
                }, 8000);
            }

            // Create initial batch
            for(let i=0; i<30; i++) {
                createConfetti();
            }

            // Continue creating occasionally
            setInterval(createConfetti, 300);
        });
    </script>
