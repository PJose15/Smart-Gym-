<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            font-family: theme('fontFamily.body-md');
        }
        
        .nextera-glow {
            box-shadow: 0 0 40px rgba(224,20,47,0.28);
        }

        .ambient-glow {
            background: radial-gradient(circle at center, rgba(224,20,47,0.15) 0%, rgba(19,19,21,0) 70%);
        }
        
        .card-border {
            border: 1px solid rgba(255,255,255,0.07);
        }

        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="min-h-screen w-full relative overflow-hidden flex flex-col items-center justify-center p-gutter-mobile md:p-gutter-desktop">
<!-- Ambient Background Glow -->
<div class="absolute inset-0 ambient-glow pointer-events-none z-0"></div>
<!-- Top-left subtle grid pattern -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none z-0 opacity-10" style="background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px); background-size: 40px 40px;"></div>
<main class="w-full max-w-md z-10 flex flex-col items-center">
<!-- Welcome Section (Initial State) -->
<div class="w-full flex flex-col items-center text-center transition-all duration-500 opacity-100" id="welcome-section">
<!-- Logo with Glow -->
<div class="relative mb-section-gap">
<div class="absolute inset-0 rounded-full nextera-glow z-0 blur-xl"></div>
<div class="relative z-10 w-24 h-24 bg-surface-container-low rounded-full card-border flex items-center justify-center">
<span class="font-wordmark text-wordmark text-on-surface tracking-widest leading-none">N</span>
</div>
</div>
<!-- Welcome Text -->
<h1 class="font-hero-lg text-hero-lg text-on-surface mb-6">
                Welcome to Iron Forge on NEXTERA.
            </h1>
<p class="font-body-md text-body-md text-text-secondary mb-hero-margin px-4">
                Your AI coach is free — Iron Forge covers it. Log your sets, and NEXTERA builds your program around the machines on this floor.
            </p>
<!-- Actions -->
<div class="w-full flex flex-col gap-4">
<button class="w-full bg-primary-container text-white py-4 rounded-lg font-label-caps text-label-caps hover:nextera-glow transition-all duration-200 active:scale-[0.98] flex items-center justify-center gap-2" onclick="showQuestionnaire()">
                    GET STARTED <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
<button class="w-full py-4 text-text-secondary font-label-caps text-label-caps hover:text-on-surface transition-colors">
                    ALREADY SET UP? LOG IN
                </button>
</div>
</div>
<!-- Questionnaire Section (Hidden Initially) -->
<div class="w-full flex flex-col hidden transition-all duration-500 opacity-0 translate-y-4" id="questionnaire-section">
<!-- Progress Dots -->
<div class="flex justify-center gap-2 mb-section-gap">
<div class="w-2 h-2 rounded-full bg-primary-container nextera-glow"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
</div>
<div class="bg-bg-card rounded-xl card-border p-6 w-full flex flex-col relative overflow-hidden">
<!-- Energy Ribbon Accent -->
<div class="absolute top-0 left-0 w-full h-[2px]" style="background: theme('colors.energy-ribbon');"></div>
<h2 class="font-headline-h1 text-headline-h1 text-on-surface mb-8 text-center">
                    What are you here to do?
                </h2>
<div class="flex flex-col gap-3">
<button class="w-full flex items-center gap-4 p-4 rounded-lg bg-surface-container-low hover:bg-surface-variant transition-colors card-border text-left group active:scale-[0.98]">
<span class="text-2xl group-hover:scale-110 transition-transform">🔥</span>
<span class="font-body-md text-body-md text-on-surface">Lose weight</span>
</button>
<button class="w-full flex items-center gap-4 p-4 rounded-lg bg-surface-container-low hover:bg-surface-variant transition-colors card-border text-left group active:scale-[0.98]">
<span class="text-2xl group-hover:scale-110 transition-transform">💪</span>
<span class="font-body-md text-body-md text-on-surface">Build muscle</span>
</button>
<button class="w-full flex items-center gap-4 p-4 rounded-lg bg-surface-container-low hover:bg-surface-variant transition-colors card-border text-left group active:scale-[0.98]">
<span class="text-2xl group-hover:scale-110 transition-transform">⚡</span>
<span class="font-body-md text-body-md text-on-surface">Improve fitness</span>
</button>
<button class="w-full flex items-center gap-4 p-4 rounded-lg bg-surface-container-low hover:bg-surface-variant transition-colors card-border text-left group active:scale-[0.98]">
<span class="text-2xl group-hover:scale-110 transition-transform">🏆</span>
<span class="font-body-md text-body-md text-on-surface">Train for a sport</span>
</button>
<button class="w-full flex items-center gap-4 p-4 rounded-lg bg-surface-container-low hover:bg-surface-variant transition-colors card-border text-left group active:scale-[0.98]">
<span class="text-2xl group-hover:scale-110 transition-transform">🌱</span>
<span class="font-body-md text-body-md text-on-surface">General health</span>
</button>
</div>
</div>
<button class="mt-8 text-text-secondary font-label-caps text-label-caps hover:text-on-surface transition-colors self-center">
                SKIP FOR NOW
            </button>
</div>
</main>
<script>
        function showQuestionnaire() {
            const welcome = document.getElementById('welcome-section');
            const questionnaire = document.getElementById('questionnaire-section');
            
            welcome.style.opacity = '0';
            welcome.style.transform = 'translateY(-20px)';
            
            setTimeout(() => {
                welcome.classList.add('hidden');
                questionnaire.classList.remove('hidden');
                
                // Trigger reflow
                void questionnaire.offsetWidth;
                
                questionnaire.style.opacity = '1';
                questionnaire.style.transform = 'translateY(0)';
            }, 300);
        }
    </script>
</body></html>
