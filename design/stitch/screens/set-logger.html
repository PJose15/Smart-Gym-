<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nextera - Set Logging</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@800&amp;family=Playfair+Display:wght@600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#e5e1e4",
                        "on-tertiary-fixed-variant": "#8e1120",
                        "surface-container-highest": "#353437",
                        "surface": "#131315",
                        "on-primary-fixed-variant": "#930018",
                        "on-tertiary-fixed": "#410007",
                        "background": "#131315",
                        "primary": "#ffb3af",
                        "tertiary-fixed": "#ffdad8",
                        "energy-ribbon": "linear-gradient(135deg, #FF2740, #8A0D1E)",
                        "secondary": "#ffb3b0",
                        "surface-dim": "#131315",
                        "inverse-primary": "#bf0023",
                        "on-tertiary-container": "#fff6f5",
                        "on-surface": "#e5e1e4",
                        "tertiary-container": "#ca4046",
                        "primary-fixed-dim": "#ffb3af",
                        "tertiary-fixed-dim": "#ffb3b1",
                        "error": "#ffb4ab",
                        "surface-container": "#201f21",
                        "secondary-fixed-dim": "#ffb3b0",
                        "on-primary": "#68000e",
                        "on-primary-fixed": "#410006",
                        "on-secondary": "#680010",
                        "outline-variant": "#5d3f3e",
                        "bg-elevated": "#121214",
                        "on-secondary-container": "#fff6f5",
                        "surface-variant": "#353437",
                        "secondary-fixed": "#ffdad8",
                        "on-secondary-fixed-variant": "#93001b",
                        "on-tertiary": "#680011",
                        "bg-card": "#16161A",
                        "surface-bright": "#39393b",
                        "on-secondary-fixed": "#410006",
                        "outline": "#ad8885",
                        "inverse-on-surface": "#313032",
                        "surface-tint": "#ffb3af",
                        "inverse-surface": "#e5e1e4",
                        "on-surface-variant": "#e7bdba",
                        "on-error-container": "#ffdad6",
                        "surface-container-low": "#1c1b1d",
                        "surface-container-lowest": "#0e0e10",
                        "primary-fixed": "#ffdad7",
                        "primary-container": "#e0142f",
                        "error-container": "#93000a",
                        "on-primary-container": "#fff5f4",
                        "tertiary": "#ffb3b1",
                        "text-secondary": "#B5B2B8",
                        "on-error": "#690005",
                        "gold": "#E8B339",
                        "surface-container-high": "#2a2a2c",
                        "secondary-container": "#e40430"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter-desktop": "24px",
                        "sub": "4px",
                        "base": "8px",
                        "hero-margin": "64px",
                        "section-gap": "32px",
                        "gutter-mobile": "16px"
                    },
                    "fontFamily": {
                        "stat-display": ["JetBrains Mono"],
                        "wordmark": ["Playfair Display"],
                        "hero-lg": ["Playfair Display"],
                        "headline-h1": ["Inter"],
                        "body-md": ["Inter"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "stat-display": ["40px", { "lineHeight": "1", "letterSpacing": "-0.03em", "fontWeight": "800" }],
                        "wordmark": ["48px", { "lineHeight": "1.2", "letterSpacing": "0.12em", "fontWeight": "600" }],
                        "hero-lg": ["40px", { "lineHeight": "1.1", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-md": ["15px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }]

                }
            }
        }
    </script>
<style>
        /* Custom utilities for the specific aesthetic */
        .hairline-border {
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .emissive-glow {
            box-shadow: 0 0 15px rgba(224, 20, 47, 0.28);
        }
        .emissive-text {
            text-shadow: 0 0 10px rgba(224, 20, 47, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface h-screen w-full overflow-hidden flex flex-col justify-end relative font-body-md">
<!-- Simulated Dark App Background Canvas -->
<div class="absolute inset-0 z-0 bg-[url('placeholder')] bg-cover bg-center opacity-30" data-alt="A dark, moody, cinematic view of a high-tech gym machine interface. Minimalist dark tones with subtle, glowing red accents. Very low key lighting, focus on a futuristic fitness environment."></div>
<div class="absolute inset-0 z-0 bg-gradient-to-t from-background via-background/90 to-transparent"></div>
<!-- Backdrop overlay for modal feel -->
<div class="absolute inset-0 z-40 bg-black/50 backdrop-blur-sm transition-opacity"></div>
<!-- Bottom Sheet Container -->
<div class="relative z-50 w-full md:w-[480px] md:mx-auto bg-bg-card rounded-t-[24px] hairline-border border-b-0 px-gutter-mobile py-6 flex flex-col gap-6 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
<!-- Drag Handle -->
<div class="absolute top-3 left-1/2 -translate-x-1/2 w-12 h-1 bg-surface-bright rounded-full opacity-50"></div>
<!-- Header Section -->
<div class="flex items-start justify-between w-full pt-2">
<div class="flex flex-col gap-1">
<div class="flex items-center gap-3">
<h2 class="font-headline-h1 text-headline-h1 text-on-surface tracking-tight">Chest Press</h2>
<span class="bg-surface-container-high px-3 py-1 rounded-full font-label-caps text-label-caps text-on-surface-variant hairline-border">
                        Set 2 of 4
                    </span>
</div>
<p class="font-body-md text-body-md text-text-secondary">Machine Chest Press · target 8–12</p>
</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container hover:bg-surface-bright transition-colors hairline-border text-text-secondary hover:text-on-surface">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Steppers Section -->
<div class="grid grid-cols-2 gap-4">
<!-- Weight Stepper -->
<div class="bg-surface rounded-xl p-4 flex flex-col items-center gap-3 hairline-border relative overflow-hidden group">
<div class="absolute inset-x-0 top-0 h-[2px] bg-gradient-to-r from-transparent via-primary-container/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="font-label-caps text-label-caps text-text-secondary uppercase tracking-widest">Weight (lb)</span>
<div class="flex items-center justify-between w-full mt-2">
<button class="w-12 h-12 rounded-full border border-primary-container/30 flex items-center justify-center text-primary-container hover:bg-primary-container/10 active:scale-95 transition-all">
<span class="material-symbols-outlined">remove</span>
</button>
<span class="font-stat-display text-stat-display text-on-surface">135</span>
<button class="w-12 h-12 rounded-full border border-primary-container/30 flex items-center justify-center text-primary-container hover:bg-primary-container/10 active:scale-95 transition-all">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<!-- Reps Stepper -->
<div class="bg-surface rounded-xl p-4 flex flex-col items-center gap-3 hairline-border relative overflow-hidden group">
<div class="absolute inset-x-0 top-0 h-[2px] bg-gradient-to-r from-transparent via-primary-container/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="font-label-caps text-label-caps text-text-secondary uppercase tracking-widest">Reps</span>
<div class="flex items-center justify-between w-full mt-2">
<button class="w-12 h-12 rounded-full border border-primary-container/30 flex items-center justify-center text-primary-container hover:bg-primary-container/10 active:scale-95 transition-all">
<span class="material-symbols-outlined">remove</span>
</button>
<span class="font-stat-display text-stat-display text-on-surface">10</span>
<button class="w-12 h-12 rounded-full border border-primary-container/30 flex items-center justify-center text-primary-container hover:bg-primary-container/10 active:scale-95 transition-all">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
</div>
<!-- RPE Section -->
<div class="flex flex-col gap-3 mt-2">
<span class="font-label-caps text-label-caps text-text-secondary uppercase tracking-widest px-1">RPE (Intensity)</span>
<div class="flex items-center justify-between w-full bg-surface p-2 rounded-xl hairline-border">
<button class="w-12 h-12 rounded-full flex items-center justify-center font-stat-display text-lg text-text-secondary hover:bg-surface-bright transition-colors border border-transparent">6</button>
<button class="w-12 h-12 rounded-full flex items-center justify-center font-stat-display text-lg text-text-secondary hover:bg-surface-bright transition-colors border border-transparent">7</button>
<button class="w-12 h-12 rounded-full flex items-center justify-center font-stat-display text-lg bg-primary-container/10 border border-primary-container text-primary emissive-glow transition-all scale-110 z-10">8</button>
<button class="w-12 h-12 rounded-full flex items-center justify-center font-stat-display text-lg text-text-secondary hover:bg-surface-bright transition-colors border border-transparent">9</button>
<button class="w-12 h-12 rounded-full flex items-center justify-center font-stat-display text-lg text-text-secondary hover:bg-surface-bright transition-colors border border-transparent">10</button>
</div>
</div>
<!-- Hint -->
<div class="flex items-center justify-center gap-2 mt-1">
<span class="material-symbols-outlined text-[16px] text-text-secondary opacity-70">history</span>
<p class="font-body-md text-sm text-text-secondary opacity-70">Last time: 130 lb × 10 @RPE 8</p>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary-container font-headline-h1 text-[20px] py-4 rounded-xl flex items-center justify-center gap-2 drop-shadow-[0_4px_20px_rgba(224,20,47,0.35)] hover:scale-[0.98] transition-transform duration-150 relative overflow-hidden group mt-2">
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
<span class="relative z-10 tracking-wide">LOG SET</span>
<span class="material-symbols-outlined relative z-10 text-[24px]">check</span>
</button>
<!-- Secondary Actions -->
<div class="flex items-center justify-between w-full px-2 pt-2 pb-safe">
<button class="flex items-center gap-1.5 text-primary text-sm font-medium hover:text-white transition-colors opacity-80 hover:opacity-100">
<span class="material-symbols-outlined text-[18px]">add</span>
                Warm-up set
            </button>
<button class="flex items-center gap-1.5 text-text-secondary text-sm font-medium hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[18px]">settings</span>
                More
            </button>
</div>
</div>
</body></html>
