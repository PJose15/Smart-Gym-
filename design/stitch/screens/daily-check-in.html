                            "surface-bright": "#39393b",
                            "on-secondary-fixed": "#410006",
                            "outline": "#ad8885",
                            "inverse-on-surface": "#313032",
                            "surface-tint": "#ffb3af",
                            "inverse-surface": "#e5e1e4",
                            "on-surface-variant": "#e7bdba",
                            "on-error-container": "#ffdad6",
                            "surface-container-low": "#1c1b1d",

<style>
        .emissive-glow {
            box-shadow: 0 0 16px rgba(224, 20, 47, 0.28);
        }
        .emissive-glow-strong {
            box-shadow: 0 0 24px rgba(224, 20, 47, 0.4);
        }
        .hairline-border {
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex items-center justify-center p-gutter-mobile relative overflow-hidden">
<!-- Atmospheric Background Glow -->
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_rgba(224,20,47,0.05)_0%,_transparent_60%)] pointer-events-none"></div>
<!-- Check-in Modal Card -->
<div class="w-full max-w-md bg-bg-card rounded-xl hairline-border p-section-gap relative z-10 flex flex-col gap-8 shadow-2xl backdrop-blur-sm">
<!-- Header -->
<div class="flex justify-between items-center">
<h1 class="font-headline-h1 text-headline-h1 text-on-surface tracking-tight">Quick check-in</h1>
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-1 rounded-full hover:bg-surface-variant/50">
<span class="material-symbols-outlined text-[28px]">close</span>
</button>
</div>
<!-- Questions Container -->
<div class="flex flex-col gap-6">
<!-- Question 1: Sleep -->
<div class="flex flex-col gap-3">
<label class="font-body-md text-on-surface-variant">How did you sleep?</label>
<div class="flex justify-between items-center bg-bg-elevated rounded-full p-1 hairline-border">
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale opacity-40 hover:opacity-80 transition-all rounded-full">😴</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale opacity-40 hover:opacity-80 transition-all rounded-full">😐</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale opacity-40 hover:opacity-80 transition-all rounded-full">🙂</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl rounded-full ring-1 ring-primary-container bg-primary-container/10 emissive-glow opacity-100 scale-105 transition-all">😊</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale opacity-40 hover:opacity-80 transition-all rounded-full">🤩</button>
</div>
</div>
<!-- Question 2: Soreness -->
<div class="flex flex-col gap-3">
<label class="font-body-md text-on-surface-variant">How sore are you today?</label>
<div class="flex justify-between items-center bg-bg-elevated rounded-full p-1 hairline-border">
<button class="w-12 h-12 flex items-center justify-center text-2xl rounded-full ring-1 ring-primary-container bg-primary-container/10 emissive-glow opacity-100 scale-105 transition-all">💪</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale opacity-40 hover:opacity-80 transition-all rounded-full">🙂</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale opacity-40 hover:opacity-80 transition-all rounded-full">😬</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale opacity-40 hover:opacity-80 transition-all rounded-full">😣</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale opacity-40 hover:opacity-80 transition-all rounded-full">🥵</button>
</div>
</div>
<!-- Question 3: Energy -->
<div class="flex flex-col gap-3">
<label class="font-body-md text-on-surface-variant">How's your energy?</label>
<div class="flex justify-between items-center bg-bg-elevated rounded-full p-1 hairline-border">
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale opacity-40 hover:opacity-80 transition-all rounded-full">🔋</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale opacity-40 hover:opacity-80 transition-all rounded-full">😐</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale opacity-40 hover:opacity-80 transition-all rounded-full">🙂</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl rounded-full ring-1 ring-primary-container bg-primary-container/10 emissive-glow opacity-100 scale-105 transition-all">⚡</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale opacity-40 hover:opacity-80 transition-all rounded-full">🚀</button>
</div>
</div>
<!-- Question 4: Stress -->
<div class="flex flex-col gap-3">
<label class="font-body-md text-on-surface-variant">Stress level?</label>
<div class="flex justify-between items-center bg-bg-elevated rounded-full p-1 hairline-border">
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale opacity-40 hover:opacity-80 transition-all rounded-full">😌</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl rounded-full ring-1 ring-primary-container bg-primary-container/10 emissive-glow opacity-100 scale-105 transition-all">🙂</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale opacity-40 hover:opacity-80 transition-all rounded-full">😐</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale opacity-40 hover:opacity-80 transition-all rounded-full">😖</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale opacity-40 hover:opacity-80 transition-all rounded-full">🤯</button>
</div>
</div>
</div>
<!-- Action Button -->
<div class="mt-4">
<button class="w-full bg-primary-container text-white py-4 rounded-lg font-label-caps text-label-caps uppercase tracking-widest hover:bg-secondary-container transition-colors duration-200 active:scale-[0.98] flex items-center justify-center gap-2 emissive-glow hover:emissive-glow-strong">
                Update my readiness
                <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</div>
</div>
<!-- Script to handle tactile interaction visually -->
<script>
        document.querySelectorAll('button:not(.bg-primary-container)').forEach(btn => {
            btn.addEventListener('mousedown', function() {
                if(!this.classList.contains('ring-primary-container')) {
                    this.style.transform = 'scale(0.95)';
                }
            });
            btn.addEventListener('mouseup', function() {
                if(!this.classList.contains('ring-primary-container')) {
                    this.style.transform = 'scale(1)';
                }
            });
            btn.addEventListener('mouseleave', function() {
                if(!this.classList.contains('ring-primary-container')) {
                    this.style.transform = 'scale(1)';
                }
            });
        });
    </script>
</body></html>
