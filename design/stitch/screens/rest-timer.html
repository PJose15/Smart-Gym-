<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 1;
        }
        
        .timer-glow {
            box-shadow: 0 0 80px rgba(224, 20, 47, 0.28);
        }
        
        @keyframes pulseRing {
            0% { stroke-opacity: 1; filter: drop-shadow(0 0 4px rgba(224, 20, 47, 0.5)); }
            50% { stroke-opacity: 0.8; filter: drop-shadow(0 0 12px rgba(224, 20, 47, 0.8)); }
            100% { stroke-opacity: 1; filter: drop-shadow(0 0 4px rgba(224, 20, 47, 0.5)); }
        }

        @keyframes intensePulse {
            0% { transform: scale(1); box-shadow: 0 0 80px rgba(255, 39, 64, 0.4); text-shadow: 0 0 10px rgba(255, 39, 64, 0.5); }
            50% { transform: scale(1.03); box-shadow: 0 0 120px rgba(255, 39, 64, 0.6); text-shadow: 0 0 20px rgba(255, 39, 64, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 80px rgba(255, 39, 64, 0.4); text-shadow: 0 0 10px rgba(255, 39, 64, 0.5); }
        }
        
        @keyframes flashGo {
            0% { opacity: 0; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        .pulse-active {
            animation: pulseRing 1s ease-in-out infinite;
        }

        .pulse-intense {
            animation: intensePulse 1s ease-in-out infinite;
            color: #FF2740 !important;
        }
        
        .go-flash {
            animation: flashGo 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            color: #FF2740;
            text-shadow: 0 0 30px rgba(255, 39, 64, 0.8);
        }

        svg circle.progress {
            transition: stroke-dashoffset 1s linear;
        }
        
        .hairline-border {
            border: 1px solid rgba(255,255,255,0.07);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation -->
<header class="flex justify-between items-center w-full px-gutter-mobile py-base bg-background/80 backdrop-blur-md z-50 fixed top-0">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/30 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="close">close</span>
</button>
<span class="font-label-caps text-label-caps text-on-surface tracking-widest opacity-70">WORKOUT IN PROGRESS</span>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/30 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="more_vert">more_vert</span>
</button>
</header>
<main class="flex-1 flex flex-col items-center justify-center px-gutter-mobile pt-24 pb-32">
<!-- Timer Centerpiece -->
<div class="relative flex flex-col items-center justify-center w-full max-w-sm aspect-square mb-section-gap">
<!-- Glow Background -->
<div class="absolute inset-0 rounded-full timer-glow z-0"></div>
<!-- SVG Ring -->
<svg class="absolute inset-0 w-full h-full transform -rotate-90 z-10" viewbox="0 0 100 100">
<!-- Track -->
<circle cx="50" cy="50" fill="none" r="45" stroke="#1c1b1d" stroke-width="4"></circle>
<!-- Progress Arc -->
<circle class="progress pulse-active" cx="50" cy="50" fill="none" id="progress-ring" r="45" stroke="#e0142f" stroke-dasharray="283" stroke-dashoffset="70" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<!-- Center Content -->
<div class="relative z-20 flex flex-col items-center justify-center w-full h-full transition-transform duration-300" id="timer-center">
<span class="font-label-caps text-label-caps text-primary tracking-[0.2em] mb-2 opacity-80">REST</span>
<div class="font-stat-display text-[72px] leading-none tracking-tighter text-on-surface" id="timer-display">0:45</div>
</div>
</div>
<!-- Up Next Card -->
<div class="w-full max-w-md bg-bg-card hairline-border rounded-xl p-4 mb-4 flex flex-col gap-3">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded bg-surface-container-high flex items-center justify-center shrink-0">
<img class="w-full h-full object-cover rounded opacity-80 mix-blend-luminosity" data-alt="A macro shot of a sleek, heavy black barbell loaded with matte black weight plates sitting on a dark gym floor. The cinematic lighting highlights the knurling on the bar." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDnIwoZHmlQngokYGJFe5Y7bhBh5z4kMM9DRua8rhoofyFfnzERfTV1GRowBRwotbvAQ7dtrDYa2mMpoCusace360AuwHo5n3_nzQcwAylYLFezznv9Lw4PYt7NC2NsUzMC6-M4Qu_42ihx1sFjzRhIqzImIQO69HzHsVNGRi9mNzfAl7R7wjHjGzHsqgI7xbP2KsmDXaQEhkFKQ5cdg12NyxexzfrwnRLYUE43ofd_GcGuILCLR6SwPG-X4xx5J8QuNV0EsBvpmgM"/>
</div>
<div class="flex flex-col flex-1">
<span class="font-label-caps text-label-caps text-primary mb-1">UP NEXT — SET <span class="font-stat-display text-[14px]">3</span> OF <span class="font-stat-display text-[14px]">4</span></span>
<span class="font-hero-lg text-2xl tracking-wide text-on-surface">Bench Press</span>
<div class="flex items-center gap-1.5 text-text-secondary mt-1">
<span class="font-stat-display text-base">135</span>
<span class="font-body-md text-sm">lb</span>
<span class="text-on-surface-variant/50 font-body-md mx-1">×</span>
<span class="font-stat-display text-base">10</span>
<span class="font-body-md text-sm">reps</span>
</div>
</div>
</div>

<div class="flex flex-col">

<div class="flex justify-center gap-4">

<span class="font-stat-display text-sm">+15s</span>
</button>
</div>
<button class="w-full flex items-center justify-center gap-2 border border-primary/20 bg-primary/10 text-primary px-6 py-4 rounded-lg hover:bg-primary/20 active:scale-95 transition-all group" id="skip-btn">
<span class="font-label-caps text-label-caps tracking-widest">SKIP REST</span>
<span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const timerDisplay = document.getElementById('timer-display');
            const progressRing = document.getElementById('progress-ring');
            const timerCenter = document.getElementById('timer-center');
            const skipBtn = document.getElementById('skip-btn');
            
            let timeLeft = 45;
            const totalTime = 45;
            const circumference = 2 * Math.PI * 45; // ~282.7
            
            function setProgress(percent) {
                const offset = circumference - (percent / 100) * circumference;
                progressRing.style.strokeDashoffset = offset;
            }

            function updateDisplay() {
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                timerDisplay.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
                
                const percent = (timeLeft / totalTime) * 100;
                setProgress(percent);

                if (timeLeft <= 5 && timeLeft > 0) {
                    timerCenter.classList.add('pulse-intense');
                    progressRing.setAttribute('stroke', '#FF2740');
                }
            }

            function finishTimer() {
                clearInterval(timerInterval);
                timerCenter.classList.remove('pulse-intense');
                progressRing.style.strokeDashoffset = 0; // Snap full
                progressRing.setAttribute('stroke', '#FF2740');
                
                timerCenter.innerHTML = `<div class="font-stat-display text-[96px] leading-none tracking-tighter go-flash">GO</div>`;
            }

            const timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    updateDisplay();
                } else {
                    finishTimer();
                }
            }, 1000);

            skipBtn.addEventListener('click', () => {
                timeLeft = 0;
                finishTimer();
            });

            // Initial setup
            updateDisplay();
        });
    </script>
