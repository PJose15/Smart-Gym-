<style>
        /* Base Animations */
        @keyframes cascadeUp {
            from { opacity: 0; transform: translateY(20px); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        
        @keyframes rollUp {
            from { opacity: 0; transform: translateY(80%) scaleY(0.8); }
            to { opacity: 1; transform: translateY(0) scaleY(1); }
        }
        
        @keyframes springIn {
            0% { opacity: 0; transform: scale(0.9) translateY(15px); }
            50% { opacity: 1; transform: scale(1.02) translateY(-2px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }

        /* Utility Classes */
        .cascade-item {
            opacity: 0;
            animation: cascadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .delay-1 { animation-delay: 60ms; }
        .delay-2 { animation-delay: 120ms; }
        .delay-3 { animation-delay: 180ms; }
        .delay-4 { animation-delay: 240ms; }
        .delay-5 { animation-delay: 300ms; }
        
        .stat-roll {
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        
        .stat-roll > .stat-value {
            opacity: 0;
            transform-origin: bottom;
            animation: rollUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .spring-card {
            opacity: 0;
            animation: springIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        .sparkline-path {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawLine 0.6s ease-out 600ms forwards;
        }

        /* Glass/Glow utilities */
        .hairline-border {
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        
        .btn-press:active {
            transform: scale(0.98);
            transition: transform 0.1s ease;
        }
    </style>

<script>
        // Confetti puff effect
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-canvas');
            if (!container) return;
            
            const colors = ['#E0142F', '#E8B339', '#ffdad7', '#bf0023']; // Crimson, Gold, Light Red, Dark Red
            const particleCount = 45;
            
            // Wait slightly for the PR block reveal
            setTimeout(() => {
                for(let i=0; i<particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.style.position = 'absolute';
                    
                    // Randomize shape (circle or small rectangle)
                    const isCircle = Math.random() > 0.4;
                    const size = Math.random() * 6 + 3;
                    particle.style.width = `${size}px`;
                    particle.style.height = isCircle ? `${size}px` : `${size * 2}px`;
                    particle.style.borderRadius = isCircle ? '50%' : '1px';
                    
                    particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    particle.style.left = '50%';
                    particle.style.top = '20px'; // Origin near the title
                    particle.style.opacity = '0';
                    particle.style.transform = 'translate(-50%, -50%)';
                    particle.style.boxShadow = `0 0 ${Math.random() * 8 + 2}px ${particle.style.backgroundColor}`;

                    // Math for trajectory
                    const angle = (Math.random() * Math.PI) - (Math.PI / 2); // Upward arc
                    const velocity = Math.random() * 120 + 40;
                    const tx = Math.sin(angle) * velocity;
                    const ty = -Math.cos(angle) * velocity - (Math.random() * 50); // Push upwards
                    const rot = Math.random() * 360;

                    container.appendChild(particle);

                    particle.animate([
                        { transform: 'translate(-50%, -50%) scale(0) rotate(0deg)', opacity: 1 },
                        { transform: `translate(calc(-50% + ${tx * 0.8}px), calc(-50% + ${ty * 0.8}px)) scale(${Math.random() + 0.8}) rotate(${rot/2}deg)`, opacity: 1, offset: 0.6 },
                        { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty + 40}px)) scale(0) rotate(${rot}deg)`, opacity: 0 }
                    ], {
                        duration: 800 + Math.random() * 600,
                        easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
                        fill: 'forwards'
                    });
                    
                    // Cleanup
                    setTimeout(() => particle.remove(), 2000);
                }
            }, 300); // 300ms matches the PR block delay roughly
        });
    </script>
